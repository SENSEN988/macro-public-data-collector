name: Official Treasury daily collector
on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'
    - cron: '47 23 * * *'
permissions:
  contents: write
concurrency:
  group: treasury-daily
  cancel-in-progress: false
jobs:
  treasury:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run checks
        run: python3 -m unittest -v test_collector.py
      - name: Collect official Treasury data
        run: python3 publish.py
      - name: Commit only verified public Treasury data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/treasury.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official daily Treasury balances'
            git push origin HEAD:main
          fi
