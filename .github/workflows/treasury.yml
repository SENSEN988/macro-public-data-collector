name: Treasury source verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  treasury:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run checks
        run: python3 -m unittest -v test_collector.py
      - name: Collect official Treasury data
        run: python3 collector.py treasury-data.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: treasury-official-data
          path: treasury-data.json.gz
          retention-days: 1
          if-no-files-found: error
